parameters:
  - name: target
    type: string
    default: "web"
    values:
      - "ios"
      - "web"
      - "apk"

#
# This file contains the steps to generate the Dart code from the Rust code.
#
steps:
  # run the codegen (this also runs build_runner for the freezed outputs)
  # - script: flutter_rust_bridge_codegen generate --dart-entrypoint-class-name TmsRustLib --rust-input crate::infra --rust-root $(Build.SourcesDirectory)/tms_infra --dart-output $(Build.SourcesDirectory)/tms_client/lib/generated
  - script: |
      cd tms_client
      flutter_rust_bridge_codegen generate
    displayName: "Run Rust to Dart Codegen"

  # build the wasm for the web client
  # the bridge is fully synchronous, so a plain stable (non threaded) release build is all that's needed
  - ${{ if eq(parameters.target, 'web') }}:
      - script: |
          wasm-pack build $(Build.SourcesDirectory)/tms_infra --target no-modules --out-dir $(Build.SourcesDirectory)/tms_client/web/pkg --no-typescript --out-name tms_infra --release
        displayName: "Build Wasm"
