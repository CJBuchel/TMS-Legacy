[package]
name = "tms_server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio = { version = "^1.53", features = ["full"] }
tokio-stream = "^0.1"
log = "0.4.34"
local-ip-address = "0.6.13"
log4rs = "1.4.0"
warp = { version = "0.4.3", features = ["server", "websocket"] }
rcgen = "^0.14"
rand = "0.10.3"
uuid = { version = "^1.28", features = ["serde", "v4"] }
async-trait = "0.1.92"
futures = "0.3.34"
chrono = "^0.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
regex = "^1.13"
anyhow = "1.0.104"
flate2 = "1.1.10"
zip = "9.0.1"
tar = "0.4.46"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
dirs = "7.0.0"
clap = { version = "4.6.7", features = ["derive"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }

[dependencies.tms_infra]
path = "../tms_infra"

[dependencies.echo_tree_infra]
path = "../echo_tree_infra"

[dependencies.echo_tree_rs]
# git = "https://github.com/CJBuchel/EchoTree.git"
path = "../echo_tree_rs"

[dependencies.tms_schedule_handler]
path = "../tms_schedule_handler"
