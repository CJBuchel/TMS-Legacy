[package]
name = "tms_infra"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
# Default to rlib for most platforms
crate-type = ["rlib", "cdylib", "staticlib"]
# crate-type = ["rlib", "cdylib"] # the pipelines replace "cdylib" with "staticlib" for ios binaries
# when doing local/simulation testing, add ["rlib", "staticlib"] and use the following to build
# cargo lipo --release --targets aarch64-apple-ios x86_64-apple-ios

[dependencies]
flutter_rust_bridge = "=2.13.0"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
schemars = "^1.2"
regex = "^1.13"
chrono = "0.4.45"
strum = "0.28.0"
strum_macros = "0.28.0"

# libc 0.2.190 limits the _dyld_* functions to macOS, but backtrace 0.3.76 (pulled in by flutter_rust_bridge) still calls
# them on iOS, so the iOS client fails to compile. Remove this once backtrace no longer needs them.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "<0.2.190"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(frb_expand)"] }
