[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.97"
axum = { version = "0.8.1", features = ["ws"] }
chrono = "0.4.40"
clap = { version = "4.5.32", features = ["derive"] }
env_logger = "0.11"
futures = "0.3.31"
jsonwebtoken = "9.3.1"
log = "0.4.26"
once_cell = "1.21.1"
rand = "0.9.0"
serde = "1.0.219"
serde_json = "1.0"
thiserror = "2.0.16"
tokio = { version = "1.44.1", features = ["full"] }
tokio-stream = "0.1.17"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }

[dependencies.database]
path = "../database"
