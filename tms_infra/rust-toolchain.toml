[toolchain]
# The Flutter build hook (native_toolchain_rust) requires an exact version here, and builds the crate for each of these targets on demand.
# This only applies to commands run from inside tms_infra (the Flutter native build and the wasm build), the server builds from the workspace root.
channel = "1.99.0"
targets = [
  "aarch64-apple-darwin",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "armv7-linux-androideabi",
  "wasm32-unknown-unknown",
  "x86_64-apple-darwin",
  "x86_64-apple-ios",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]
