name: tms
description: "Tournament Management System Client, for scoring and managing FLL events"
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 0.0.0+0 # this is replaced in azure pipelines during release

environment:
  sdk: ^3.13.5
  flutter: "3.47.7"

dependencies:
  # specialized deps
  flutter:
    sdk: flutter
  echo_tree_flutter:
    path: ../echo_tree_flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0

  web_socket_channel: ^3.0.3
  http: ^1.2.1
  uuid: ^4.3.3
  logger: ^2.2.0
  shared_preferences: ^2.2.3
  go_router: ^18.0.2
  responsive_framework: ^1.5.1
  provider: ^6.1.2
  path_provider: ^2.1.3
  qr_flutter: ^4.1.0
  file_picker: ^13.1.0
  just_audio: ^0.10.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  dropdown_search: ^8.1.0
  file_saver: ^0.7.0
  package_info_plus: ^10.2.2
  google_fonts: ^9.0.0

  collection: ^1.19.1
  material_ui: ^1.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  freezed: ^3.2.5

# run -> `flutter pub run flutter_launcher_icons` to generate icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/T_LOGO_PADDED.png"
  adaptive_icon_background: "#212332" # Set your desired background color or image path
  adaptive_icon_foreground: "assets/logos/T_LOGO_PADDED.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/missions/2023/
    - assets/images/missions/2024/
    - assets/images/missions/2025/
    - assets/images/missions/2026/
    - assets/logos/
    - assets/audio/

    # google fonts
    - assets/fonts/google_fonts/

  fonts:
    # timer fonts
    - family: lcdbold
      fonts:
        - asset: assets/fonts/LCDBOLD.ttf
